<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 700" role="img" aria-labelledby="title desc">
  <title id="title">Black Milk — striped circular backdrop</title>
  <desc id="desc">Warm white circular center with a fine outline and vintage powder-blue stripes around the edge. Transparent exterior.</desc>

  <defs>
    <!-- The stripes stay strictly within the outer medallion. -->
    <clipPath id="outer-disc">
      <circle cx="350" cy="350" r="333"/>
    </clipPath>
    <pattern id="powder-blue-stripes" width="91" height="700" patternUnits="userSpaceOnUse" x="17">
      <rect x="0" y="0" width="33" height="700" fill="#829BA9"/>
    </pattern>
  </defs>

  <!-- Transparent beyond this outer circular silhouette. -->
  <g clip-path="url(#outer-disc)">
    <circle cx="350" cy="350" r="333" fill="#F9F6EB"/>
    <rect x="0" y="0" width="700" height="700" fill="url(#powder-blue-stripes)"/>
  </g>

  <!-- Outer rim and the large white central circle. -->
  <circle cx="350" cy="350" r="333" fill="none" stroke="#CE9E98" stroke-width="1.8" opacity="0.75"/>
  <circle cx="350" cy="350" r="294" fill="#FBF8EE" stroke="#89817B" stroke-width="1.35"/>
</svg>

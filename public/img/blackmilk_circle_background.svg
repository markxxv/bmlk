<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="title desc">
  <title id="title">Black Milk — striped circular backdrop</title>
  <desc id="desc">Striped circular medallion with a warm ivory center, thin outlines and soft powder-blue vertical stripes around the edge.</desc>

  <defs>
    <clipPath id="outer-disc">
      <circle cx="350" cy="350" r="333"/>
    </clipPath>
    <pattern id="powder-blue-stripes" width="46" height="700" patternUnits="userSpaceOnUse" x="5">
      <rect x="0" y="0" width="19" height="700" fill="#86A4B5"/>
      <rect x="19" y="0" width="27" height="700" fill="#F8F4E9"/>
    </pattern>
  </defs>

  <g clip-path="url(#outer-disc)">
    <rect x="0" y="0" width="700" height="700" fill="#F8F4E9"/>
    <rect x="0" y="0" width="700" height="700" fill="url(#powder-blue-stripes)"/>
  </g>

  <circle cx="350" cy="350" r="333" fill="none" stroke="#C88E95" stroke-width="2.2" opacity="0.95"/>
  <circle cx="350" cy="350" r="292" fill="#FBF8EE"/>
  <circle cx="350" cy="350" r="292" fill="none" stroke="#8B817D" stroke-width="1.5"/>
  <circle cx="350" cy="350" r="286" fill="none" stroke="#D7B1B0" stroke-width="1.1" opacity="0.9"/>
</svg>
